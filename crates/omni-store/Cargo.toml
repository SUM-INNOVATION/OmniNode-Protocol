[package]
name             = "omni-store"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tempfile = { workspace = true }
omni-types = { workspace = true }
omni-net   = { workspace = true }
libp2p     = { workspace = true }
memmap2    = { workspace = true }
blake3     = { workspace = true }
cid        = { workspace = true }
multihash  = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
ciborium   = { workspace = true }
bincode    = { workspace = true }
async-trait = { workspace = true }
anyhow     = { workspace = true }
# Issue #149 — idempotent Public V2 publication. The chain's own Public V2
# identity (`storage_metadata::CHUNK_SIZE`, `Hash::merkle_root`, which SNIP's
# chunker and Merkle tree match byte for byte) and its account derivation
# (`Address::from_public_key`), from the published wire crate at the version
# SNIP pins. A pure encoding leaf crate: no signing, state or networking; not
# `sumchain-crypto` / `sumchain-primitives`, which stay behind `submit`.
sumchain-wire = { workspace = true }
# Issue #149 — the read-only `storage_getFileInfoV2` lookup the publication
# decides from, against the RPC endpoint `sum-node` itself uses. Already in
# the default graph through `omni-sumchain`.
ureq       = { workspace = true }

[dev-dependencies]
# S1's capture-seam tests need an executor and futures::io; `tempfile` is now a
# regular dependency (publication staging) so it is not repeated here.
tokio    = { workspace = true }
futures  = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
