[package]
name             = "omni-store"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tempfile = { workspace = true }
omni-types = { workspace = true }
omni-net   = { workspace = true }
libp2p     = { workspace = true }
memmap2    = { workspace = true }
blake3     = { workspace = true }
cid        = { workspace = true }
multihash  = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
ciborium   = { workspace = true }
bincode    = { workspace = true }
async-trait = { workspace = true }
anyhow     = { workspace = true }
# Issue #149 — the chain account a key signs as is base58 with a checksum.
# Already in the graph through libp2p.
bs58       = { workspace = true }
# Issue #149 — the read-only `storage_getFileInfoV2` lookup the publication
# decides from, against the RPC endpoint `sum-node` itself uses. Already in
# the default graph through `omni-sumchain`.
ureq       = { workspace = true }

[dev-dependencies]
# Issue #149 — tests pin the Public V2 root, chunk size and account
# derivation to the chain's own implementation (=0.4.0, the version SNIP
# pins). Dev-only: the default dependency graph has no chain crate.
sumchain-wire = { workspace = true }
# S1's capture-seam tests need an executor and futures::io; `tempfile` is now a
# regular dependency (publication staging) so it is not repeated here.
tokio    = { workspace = true }
futures  = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Issue #161: a caret requirement, not an exact pin. Publication uses only the
# `fs` calls 1.1.4 already has (`open`, `openat`, `linkat` and `unlinkat` with
# `AtFlags`), and an exact pin stopped downstream projects from resolving one
# lock file with any crate that needs a later 1.1 patch release. This
# workspace's own build stays pinned by its Cargo.lock.
rustix = { version = "1.1.4", features = ["fs"] }
